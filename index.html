<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DokEditor Channel</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>DokEditor</h1>
        <h2>Football Editor & Motion Designer</h2>

        <div class="stats">
            <div class="box">
                <h3>30K+</h3>
                <p>Total Views</p>
            </div>

            <div class="box">
                <h3 id="subCount">0</h3>
                <p>Subscribers</p>
            </div>
        </div>

        <div class="skills">
            <h2>What I Do</h2>
            <p>
                I create football edits with smooth motion design,
                cinematic transitions, and clean effects.
                Passionate about editing and growing my channel.
            </p>
        </div>

        <div class="youtube">
            <a href="https://youtube.com/@DokEditor" target="_blank">
                Subscribe on YouTube
            </a>
        </div>

        <footer>
            © 2026 | Designed by DokEditor
        </footer>
    </div>

    <!-- JS Subscriber Counter -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let start = 0;
            let end = 109;
            let speed = 25;

            let counter = setInterval(() => {
                start++;
                document.getElementById("subCount").innerText = start;

                if (start >= end) {
                    clearInterval(counter);
                }
            }, speed);
        });
    </script>
</body>
</html>
