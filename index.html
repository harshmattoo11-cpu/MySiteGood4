<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>DokEditor Channel</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: black;
            color: white;
            text-align: center;
        }

        .container {
            padding: 50px;
            animation: fadeIn 1.5s ease-in;
        }

        h1 {
            color: gold;
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: 300;
        }

        /* Stats animation */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
        }

        .box {
            border: 2px solid gold;
            padding: 20px 30px;
            border-radius: 12px;
            min-width: 150px;
            animation: slideUp 1.5s ease;
        }

        .box h3 {
            color: gold;
            font-size: 28px;
            margin: 0;
        }

        .box p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        .skills {
            margin-top: 40px;
            animation: fadeIn 2s ease;
        }

        .skills h2 {
            color: gold;
        }

        .skills p {
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        /* YouTube button animation */
        .youtube {
            margin-top: 40px;
            animation: slideUp 2s ease;
        }

        .youtube a {
            text-decoration: none;
            color: black;
            background-color: gold;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 0 0 gold;
        }

        .youtube a:hover {
            background-color: white;
            box-shadow: 0 0 20px gold;
            transform: scale(1.05);
        }

        footer {
            margin-top: 60px;
            font-size: 14px;
            color: #aaa;
            animation: fadeIn 2.5s ease;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<script>
let start = 0;
let end = 109;        // your subscribers
let speed = 30;      // smaller = faster

let counter = setInterval(function () {
    start++;
    document.getElementById("subCount").innerText = start;

    if (start >= end) {
        clearInterval(counter);
    }
}, speed);
</script>
<body>
    <div class="container">
        <h1>DokEditor</h1>
        <h2>Football Editor & Motion Designer</h2>

        <div class="stats">
            <div class="box">
                <h3>30K+</h3>
                <p>Total Views</p>
            </div>

            <div class="box">
                <h3>109</h3>
                <p>Subscribers</p>
            </div>
        </div>

        <div class="skills">
            <h2>What I Do</h2>
            <p>
                I create football edits with smooth motion design,
                cinematic transitions, and clean effects.
                Passionate about editing and growing my channel.
            </p>
        </div>

        <div class="youtube">
            <a href="https://youtube.com/@DokEditor" target="_blank">
                Subscribe on YouTube
            </a>
        </div>

        <footer>
            © 2026 | Designed by DokEditor
        </footer>
    </div>
</body>
</html>
